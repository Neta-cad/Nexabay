<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service — NexaServices | Nexabay</title>
  <link rel="stylesheet" href="../../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f8f9fa;
      font-family: 'Inter', sans-serif;
      padding-bottom: 100px;
    }

    /* ── TOP NAV ── */
    .sv-nav {
      background: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .sv-nav-back {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      font-size: 1em;
      flex-shrink: 0;
    }
    .sv-nav-title {
      font-weight: 700;
      font-size: 0.95em;
      color: #1a1a1a;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sv-nav-share {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      font-size: 1em;
    }

    /* ── SERVICE IMAGE ── */
    .sv-image-wrap {
      width: 100%;
      height: 240px;
      background: linear-gradient(135deg, #1a237e, #0a0f1e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5em;
      position: relative;
      overflow: hidden;
    }
    .sv-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .sv-image-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #ff6b00;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75em;
      font-weight: 700;
    }

    /* ── MAIN CONTENT ── */
    .sv-content {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ── SERVICE HEADER ── */
    .sv-header {
      background: white;
      border-radius: 0 0 16px 16px;
      padding: 20px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .sv-category-tag {
      display: inline-block;
      background: #fff3e0;
      color: #ff6b00;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75em;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .sv-title {
      font-size: 1.3em;
      font-weight: 800;
      color: #1a1a1a;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    .sv-meta-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .sv-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82em;
      color: #666;
    }
    .sv-meta-item strong { color: #333; }
    .sv-stars {
      color: #f5a623;
      font-size: 0.9em;
    }
    .sv-price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0 0;
      border-top: 1px solid #f5f5f5;
    }
    .sv-price {
      font-size: 1.8em;
      font-weight: 900;
      color: #ff6b00;
    }
    .sv-price small {
      font-size: 0.45em;
      font-weight: 500;
      color: #999;
    }
    .sv-delivery-time {
      background: #f5f5f5;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.78em;
      font-weight: 600;
      color: #333;
    }

    /* ── PROVIDER CARD ── */
    .sv-provider-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .sv-provider-card h3 {
      font-size: 0.88em;
      color: #999;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sv-provider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sv-provider-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b00, #ff9500);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4em;
      font-weight: 800;
      flex-shrink: 0;
    }
    .sv-provider-info { flex: 1; }
    .sv-provider-name {
      font-weight: 800;
      font-size: 1em;
      color: #1a1a1a;
      margin-bottom: 2px;
    }
    .sv-provider-tag {
      font-size: 0.78em;
      color: #ff6b00;
      font-weight: 600;
    }
    .sv-provider-location {
      font-size: 0.78em;
      color: #999;
      margin-top: 2px;
    }
    .sv-chat-btn {
      background: #25d366;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.82em;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    /* ── ABOUT SECTION ── */
    .sv-section-card {
      background: white;
      border-radius: 16px;
      padding: 20px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .sv-section-card h3 {
      font-size: 1em;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f5f5f5;
    }
    .sv-desc {
      font-size: 0.88em;
      color: #555;
      line-height: 1.8;
    }

    /* ── WHAT'S INCLUDED ── */
    .sv-includes-list {
      list-style: none;
      display: grid;
      gap: 10px;
    }
    .sv-includes-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.88em;
      color: #444;
    }
    .sv-includes-list li::before {
      content: '✅';
      flex-shrink: 0;
    }

    /* ── TRUST BADGES ── */
    .sv-trust-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 10px;
    }
    .sv-trust-item {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .sv-trust-item-icon { font-size: 1.5em; margin-bottom: 4px; }
    .sv-trust-item-title {
      font-size: 0.78em;
      font-weight: 700;
      color: #333;
      margin-bottom: 2px;
    }
    .sv-trust-item-desc {
      font-size: 0.7em;
      color: #999;
    }

    /* ── BOTTOM CTA ── */
    .sv-bottom-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 12px 16px;
      border-top: 1px solid #eee;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
      z-index: 200;
    }
    .sv-bottom-cta-inner {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .sv-bottom-price {
      flex: 1;
    }
    .sv-bottom-price-label {
      font-size: 0.72em;
      color: #999;
    }
    .sv-bottom-price-value {
      font-size: 1.2em;
      font-weight: 900;
      color: #ff6b00;
    }
    .sv-hire-now-btn {
      background: #ff6b00;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 1em;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 4px 16px rgba(255,107,0,0.4);
    }

    /* ── BOOKING MODAL ── */
    .sv-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 900;
      backdrop-filter: blur(4px);
    }
    .sv-modal {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-radius: 24px 24px 0 0;
      max-height: 90vh;
      overflow-y: auto;
      z-index: 901;
      padding: 20px 16px;
    }
    .sv-modal-handle {
      width: 40px;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .sv-modal h3 {
      font-size: 1.2em;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .sv-modal-subtitle {
      font-size: 0.85em;
      color: #999;
      margin-bottom: 20px;
    }
    .sv-form-group {
      margin-bottom: 14px;
    }
    .sv-form-group label {
      display: block;
      font-size: 0.82em;
      font-weight: 700;
      color: #333;
      margin-bottom: 6px;
    }
    .sv-form-group input,
    .sv-form-group textarea,
    .sv-form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.9em;
      outline: none;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s;
    }
    .sv-form-group input:focus,
    .sv-form-group textarea:focus {
      border-color: #ff6b00;
    }
    .sv-modal-summary {
      background: #fff8f0;
      border: 1.5px solid #ffd0a0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .sv-modal-summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85em;
      margin-bottom: 6px;
      color: #555;
    }
    .sv-modal-summary-row.total {
      font-weight: 800;
      font-size: 1em;
      color: #ff6b00;
      border-top: 1px solid #ffd0a0;
      padding-top: 8px;
      margin-top: 4px;
    }
    .sv-modal-error {
      background: #fff0f0;
      border: 1px solid #ffcccc;
      color: #cc0000;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85em;
      margin-bottom: 12px;
      display: none;
    }
    .sv-modal-success {
      background: #f0fff4;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85em;
      margin-bottom: 12px;
      display: none;
    }
    .sv-modal-submit-btn {
      width: 100%;
      padding: 16px;
      background: #ff6b00;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1em;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 4px 16px rgba(255,107,0,0.3);
      margin-bottom: 8px;
    }
    .sv-modal-secure {
      text-align: center;
      font-size: 0.75em;
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* ── LOADING STATE ── */
    .sv-page-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      color: #999;
      gap: 12px;
    }
    .sv-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #f0f0f0;
      border-top-color: #ff6b00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ERROR STATE ── */
    .sv-error-state {
      text-align: center;
      padding: 60px 20px;
    }
    .sv-error-state h2 { margin-bottom: 8px; }
    .sv-error-state p { color: #999; margin-bottom: 20px; }
    .sv-back-btn {
      display: inline-block;
      background: #ff6b00;
      color: white;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- TOP NAV -->
  <div class="sv-nav">
    <button class="sv-nav-back" onclick="window.history.back()">←</button>
    <div class="sv-nav-title" id="nav-title">Loading...</div>
    <button class="sv-nav-share" onclick="shareService()">⬆️</button>
  </div>

  <!-- PAGE CONTENT -->
  <div id="sv-page">
    <div class="sv-page-loading">
      <div class="sv-spinner"></div>
      <p>Loading service...</p>
    </div>
  </div>

  <!-- BOOKING MODAL -->
  <div class="sv-modal-overlay" id="modal-overlay" onclick="closeModal()"></div>
  <div class="sv-modal" id="booking-modal">
    <div class="sv-modal-handle"></div>
    <h3>📋 Request This Service</h3>
    <p class="sv-modal-subtitle">Fill in your details and we'll connect you with the provider</p>

    <div class="sv-form-group">
      <label>Your Full Name *</label>
      <input type="text" id="bk-name" placeholder="e.g. Chidi Okafor"/>
    </div>
    <div class="sv-form-group">
      <label>Phone Number *</label>
      <input type="tel" id="bk-phone" placeholder="080xxxxxxxx"/>
    </div>
    <div class="sv-form-group">
      <label>Email Address *</label>
      <input type="email" id="bk-email" placeholder="your@email.com"/>
    </div>
    <div class="sv-form-group">
      <label>Describe What You Need *</label>
      <textarea id="bk-desc" rows="3" placeholder="Tell the provider exactly what you need done..."></textarea>
    </div>
    <div class="sv-form-group">
      <label>Preferred Date</label>
      <input type="date" id="bk-date"/>
    </div>

    <div class="sv-modal-summary" id="modal-summary"></div>

    <div class="sv-modal-error" id="modal-error"></div>
    <div class="sv-modal-success" id="modal-success"></div>

    <button class="sv-modal-submit-btn" id="modal-submit-btn" onclick="submitBooking()">
      🔒 Confirm & Pay Now
    </button>
    <div class="sv-modal-secure">🔒 Secured by Nexabay Escrow • Powered by Paystack</div>
  </div>

  <!-- BOTTOM CTA -->
  <div class="sv-bottom-cta" id="bottom-cta" style="display:none;">
    <div class="sv-bottom-cta-inner">
      <div class="sv-bottom-price">
        <div class="sv-bottom-price-label">Starting from</div>
        <div class="sv-bottom-price-value" id="bottom-price">₦0</div>
      </div>
      <button class="sv-hire-now-btn" onclick="openModal()">Hire Now ⚡</button>
    </div>
  </div>

  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase/config.js"></script>
  <script src="../../js/firebase/auth.js"></script>
  <script src="../../js/firebase/services.js"></script>
  <script src="../../js/firebase/payment.js"></script>
  <script src="../../js/core/main.js"></script>
  <script>

    var currentService = null;

    function getParam(key) {
      return new URLSearchParams(window.location.search).get(key);
    }

    function loadService() {
      var id = getParam('id');
      if (!id) { showError(); return; }

      db.collection('services').doc(id).get()
        .then(function(doc) {
          if (!doc.exists) { showError(); return; }
          currentService = Object.assign({ id: doc.id }, doc.data());
          renderService(currentService);
        })
        .catch(function() { showError(); });
    }

    function renderService(s) {
      var navTitle = document.getElementById('nav-title');
      if (navTitle) navTitle.textContent = s.title || 'Service';

      document.title = (s.title || 'Service') + ' — NexaServices | Nexabay';

      var imgHtml = s.imageUrl
        ? '<img src="' + s.imageUrl + '" alt="' + (s.title || '') + '"/>'
        : '<span>' + (s.emoji || '🛠️') + '</span>';

      var stars = '';
      var rating = s.rating || 0;
      for (var i = 0; i < 5; i++) {
        stars += i < Math.round(rating) ? '★' : '☆';
      }

      var page = document.getElementById('sv-page');
      page.innerHTML =
        '<div class="sv-image-wrap">' +
          imgHtml +
          '<div class="sv-image-badge">' + (s.category || 'Service') + '</div>' +
        '</div>' +

        '<div class="sv-content">' +

          '<div class="sv-header">' +
            '<div class="sv-category-tag">' + (s.category || 'Service') + '</div>' +
            '<div class="sv-title">' + (s.title || 'Service') + '</div>' +
            '<div class="sv-meta-row">' +
              '<div class="sv-meta-item"><span class="sv-stars">' + stars + '</span> ' +
                (rating > 0 ? '<strong>' + rating.toFixed(1) + '</strong>' : '<strong>New</strong>') +
                ' (' + (s.reviews || 0) + ' reviews)' +
              '</div>' +
              '<div class="sv-meta-item">📍 ' + (s.location || 'Nigeria') + '</div>' +
              '<div class="sv-meta-item">⏱️ ' + (s.deliveryTime || 'Negotiable') + '</div>' +
            '</div>' +
            '<div class="sv-price-row">' +
              '<div class="sv-price">₦' + parseInt(s.price || 0).toLocaleString() + '<small> per service</small></div>' +
              '<div class="sv-delivery-time">⏱️ ' + (s.deliveryTime || 'Flexible') + '</div>' +
            '</div>' +
          '</div>' +

          '<div class="sv-provider-card">' +
            '<h3>About the Provider</h3>' +
            '<div class="sv-provider-row">' +
              '<div class="sv-provider-avatar">' + (s.providerName || 'P')[0].toUpperCase() + '</div>' +
              '<div class="sv-provider-info">' +
                '<div class="sv-provider-name">' + (s.providerName || 'Nexabay Provider') + '</div>' +
                '<div class="sv-provider-tag">✅ Verified Provider</div>' +
                '<div class="sv-provider-location">📍 ' + (s.location || 'Nigeria') + '</div>' +
              '</div>' +
              '<button class="sv-chat-btn" onclick="chatProvider()">💬 Chat</button>' +
            '</div>' +
          '</div>' +

          '<div class="sv-section-card">' +
            '<h3>About This Service</h3>' +
            '<p class="sv-desc">' + (s.description || 'No description provided.') + '</p>' +
          '</div>' +

          '<div class="sv-section-card">' +
            '<h3>What\'s Included</h3>' +
            '<ul class="sv-includes-list">' +
              '<li>Professional service delivery by verified provider</li>' +
              '<li>Direct communication with the provider</li>' +
              '<li>Secure payment held in Nexabay escrow</li>' +
              '<li>Money released only when you are satisfied</li>' +
              '<li>Nexabay buyer protection on all bookings</li>' +
            '</ul>' +
          '</div>' +

          '<div class="sv-section-card">' +
            '<h3>Why Book on Nexabay?</h3>' +
            '<div class="sv-trust-grid">' +
              '<div class="sv-trust-item">' +
                '<div class="sv-trust-item-icon">🔒</div>' +
                '<div class="sv-trust-item-title">Secure Escrow</div>' +
                '<div class="sv-trust-item-desc">Pay safely, release on delivery</div>' +
              '</div>' +
              '<div class="sv-trust-item">' +
                '<div class="sv-trust-item-icon">✅</div>' +
                '<div class="sv-trust-item-title">Verified Providers</div>' +
                '<div class="sv-trust-item-desc">All providers are reviewed</div>' +
              '</div>' +
              '<div class="sv-trust-item">' +
                '<div class="sv-trust-item-icon">🛡️</div>' +
                '<div class="sv-trust-item-title">50% Protection</div>' +
                '<div class="sv-trust-item-desc">Minimum refund guarantee</div>' +
              '</div>' +
              '<div class="sv-trust-item">' +
                '<div class="sv-trust-item-icon">📱</div>' +
                '<div class="sv-trust-item-title">Easy on Phone</div>' +
                '<div class="sv-trust-item-desc">Book from anywhere in Nigeria</div>' +
              '</div>' +
            '</div>' +
          '</div>' +

        '</div>';

      var bottomCta = document.getElementById('bottom-cta');
      var bottomPrice = document.getElementById('bottom-price');
      if (bottomCta) bottomCta.style.display = 'block';
      if (bottomPrice) bottomPrice.textContent = '₦' + parseInt(s.price || 0).toLocaleString();

      updateModalSummary();
    }

    function updateModalSummary() {
      if (!currentService) return;
      var el = document.getElementById('modal-summary');
      if (!el) return;
      el.innerHTML =
        '<div class="sv-modal-summary-row"><span>Service</span><span>' + (currentService.title || '') + '</span></div>' +
        '<div class="sv-modal-summary-row"><span>Provider</span><span>' + (currentService.providerName || '') + '</span></div>' +
        '<div class="sv-modal-summary-row"><span>Delivery</span><span>' + (currentService.deliveryTime || 'Negotiable') + '</span></div>' +
        '<div class="sv-modal-summary-row total"><span>Total</span><span>₦' + parseInt(currentService.price || 0).toLocaleString() + '</span></div>';
    }

    function openModal() {
      var user = JSON.parse(localStorage.getItem('nexa_current_user') || 'null');
      if (!user) {
        showToast('⚠️ Please login to hire', '#ff9500');
        setTimeout(function() {
          window.location.href = '../auth/login.html';
        }, 1200);
        return;
      }
      var nameInput  = document.getElementById('bk-name');
      var phoneInput = document.getElementById('bk-phone');
      var emailInput = document.getElementById('bk-email');
      if (nameInput)  nameInput.value  = user.fullName || user.firstName || '';
      if (phoneInput) phoneInput.value = user.phone || '';
      if (emailInput) emailInput.value = user.email || '';

      var today = new Date().toISOString().split('T')[0];
      var dateInput = document.getElementById('bk-date');
      if (dateInput) dateInput.value = today;

      document.getElementById('modal-overlay').style.display = 'block';
      document.getElementById('booking-modal').style.display = 'block';
      document.getElementById('modal-error').style.display   = 'none';
      document.getElementById('modal-success').style.display = 'none';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
      document.getElementById('booking-modal').style.display = 'none';
    }

    function submitBooking() {
      var name  = document.getElementById('bk-name').value.trim();
      var phone = document.getElementById('bk-phone').value.trim();
      var email = document.getElementById('bk-email').value.trim();
      var desc  = document.getElementById('bk-desc').value.trim();
      var errEl = document.getElementById('modal-error');
      var sucEl = document.getElementById('modal-success');
      var btn   = document.getElementById('modal-submit-btn');

      errEl.style.display = 'none';
      sucEl.style.display = 'none';

      if (!name)  { errEl.textContent = 'Please enter your name';    errEl.style.display = 'block'; return; }
      if (!phone) { errEl.textContent = 'Please enter your phone';   errEl.style.display = 'block'; return; }
      if (!email) { errEl.textContent = 'Please enter your email';   errEl.style.display = 'block'; return; }
      if (!desc)  { errEl.textContent = 'Please describe your need'; errEl.style.display = 'block'; return; }

      btn.textContent = 'Processing...';
      btn.disabled = true;

      nexaPayWithPaystack({
        email:     email,
        amount:    currentService.price || 0,
        name:      name,
        orderId:   'SVC-' + currentService.id + '-' + Date.now(),
        orderType: 'service',
        onSuccess: function(reference) {
          db.collection('serviceBookings').add({
            serviceId:    currentService.id,
            serviceTitle: currentService.title,
            providerId:   currentService.providerId,
            providerName: currentService.providerName,
            customerName: name,
            customerPhone: phone,
            customerEmail: email,
            description:  desc,
            date:         document.getElementById('bk-date').value,
            amount:       currentService.price,
            paymentRef:   reference,
            status:       'confirmed',
            createdAt:    firebase.firestore.FieldValue.serverTimestamp(),
          }).then(function() {
            sucEl.textContent = '🎉 Booking confirmed! ' + currentService.providerName + ' will contact you soon.';
            sucEl.style.display = 'block';
            btn.textContent = '✅ Booked!';
            setTimeout(function() { closeModal(); }, 2000);
          }).catch(function() {
            sucEl.textContent = '🎉 Payment successful! Your booking is being confirmed.';
            sucEl.style.display = 'block';
            btn.textContent = '✅ Booked!';
          });
        },
        onCancel: function() {
          btn.textContent = '🔒 Confirm & Pay Now';
          btn.disabled = false;
          showToast('⚠️ Payment cancelled', '#ff9500');
        }
      });
    }

    function chatProvider() {
      var phone = '+2349076519852';
      var msg   = 'Hi, I found your service on Nexabay: ' + (currentService ? currentService.title : '') + '. I\'m interested!';
      window.open('https://wa.me/' + phone.replace(/[^0-9]/g, '') + '?text=' + encodeURIComponent(msg), '_blank');
    }

    function shareService() {
      if (navigator.share) {
        navigator.share({
          title: currentService ? currentService.title : 'NexaServices',
          text:  'Check out this service on Nexabay!',
          url:   window.location.href,
        });
      } else {
        navigator.clipboard.writeText(window.location.href);
        showToast('✅ Link copied!');
      }
    }

    function showError() {
      document.getElementById('sv-page').innerHTML =
        '<div class="sv-error-state">' +
          '<div style="font-size:4em;margin-bottom:16px;">😕</div>' +
          '<h2>Service not found</h2>' +
          '<p>This service may have been removed or is no longer available.</p>' +
          '<a href="browse.html" class="sv-back-btn">← Browse Services</a>' +
        '</div>';
    }

    function showToast(msg, color) {
      var t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:' +
        (color || '#333') + ';color:white;padding:12px 20px;border-radius:10px;font-size:0.88em;' +
        'font-weight:600;z-index:9999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.2);';
      document.body.appendChild(t);
      setTimeout(function() { t.remove(); }, 2500);
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadService();
    });

  </script>

</body>
</html>
